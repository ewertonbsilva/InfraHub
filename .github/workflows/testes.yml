name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Sintaxe do JavaScript
        run: |
          node --check server.js
          node --check auth.js
          node --check public/app.js
      - name: Dependências sem vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=high
